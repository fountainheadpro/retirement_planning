[project]
name = "retirement-planning"
version = "0.2.0"
description = "Reproducible Monte Carlo retirement simulator with flexible spending rules, block bootstrap, AR models, and cash/buffer strategies. Companion to published sequence-risk research reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["retirement", "monte-carlo", "sequence-risk", "withdrawal-rate", "block-bootstrap", "financial-planning"]
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "statsmodels>=0.14.5",
    "streamlit>=1.51.0",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.6",
    "pytest>=9.0.1",
]
